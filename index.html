<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PROMPO — Prompt AI untuk Kandungan Kreatif</title>
<meta name="theme-color" content="#121016">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#121016; --ink:#F3F0F5; --muted:#A79CB0; --muted-2:#6F6478;
    --coral:#FF6B5E; --violet:#7C5CFF;
    --grad: linear-gradient(120deg, var(--coral), var(--violet));
    --ok:#4CC38A; --warn:#E3A93E; --err:#E15B4F;
    --shadow-d:rgba(0,0,0,0.6); --shadow-l:rgba(255,255,255,0.05);
    --sh-out: 6px 6px 14px var(--shadow-d), -6px -6px 14px var(--shadow-l);
    --sh-out-sm: 3px 3px 8px var(--shadow-d), -3px -3px 8px var(--shadow-l);
    --sh-in: inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l);
    --sh-in-sm: inset 2px 2px 5px var(--shadow-d), inset -2px -2px 5px var(--shadow-l);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .shell{ max-width:520px; margin:0 auto; min-height:100dvh; }

  header{ position:sticky; top:0; z-index:20; background:var(--bg); padding:16px 18px 0;
    box-shadow:0 8px 16px -10px var(--shadow-d); }
  .brand{ display:flex; align-items:center; gap:11px; padding-bottom:14px; }
  .brand-mark{ width:36px; height:36px; border-radius:12px; background:var(--grad); display:flex; align-items:center;
    justify-content:center; flex-shrink:0; box-shadow:var(--sh-out-sm); }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-name{ font-family:'Sora',sans-serif; font-weight:800; font-size:20px; letter-spacing:0.2px; }
  .brand-tag{ font-size:11px; color:var(--muted); margin-top:1px; }
  .cat-tabs{ display:flex; gap:9px; overflow-x:auto; padding:2px 2px 14px; -webkit-overflow-scrolling:touch; }
  .cat-tabs::-webkit-scrollbar{ display:none; }
  .cat-tab{ flex:0 0 auto; padding:9px 15px; border-radius:20px; font-size:12.5px; font-weight:600; white-space:nowrap;
    background:var(--bg); color:var(--muted); border:none; cursor:pointer; box-shadow:var(--sh-out-sm); }
  .cat-tab.active{ background:var(--grad); color:#fff; box-shadow:var(--sh-out-sm); }
  .cat-tab:active{ box-shadow:var(--sh-in-sm); }

  main{ padding:20px 18px 50px; }
  section{ margin-bottom:26px; }
  .sec-title{ font-family:'Sora',sans-serif; font-weight:700; font-size:14.5px; margin-bottom:11px; display:flex;
    align-items:center; gap:8px; }
  .sec-title .num{ width:20px; height:20px; border-radius:7px; background:var(--bg); box-shadow:var(--sh-out-sm);
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted); }

  /* templates */
  .tpl-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:11px; }
  .tpl-card{ background:var(--bg); border:none; border-radius:15px; padding:13px; cursor:pointer; text-align:left;
    box-shadow:var(--sh-out-sm); }
  .tpl-card.active{ box-shadow:var(--sh-out-sm), inset 0 0 0 2px var(--coral); }
  .tpl-card:active{ box-shadow:var(--sh-in-sm); }
  .tpl-emoji{ font-size:19px; }
  .tpl-name{ font-weight:600; font-size:12.5px; margin-top:7px; line-height:1.3; }
  .tpl-desc{ font-size:10.5px; color:var(--muted); margin-top:3px; line-height:1.35; }

  /* form groups */
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:7px;
    text-transform:uppercase; letter-spacing:0.4px; }
  .field input[type="text"], .field textarea{ width:100%; background:var(--bg); border:none; box-shadow:var(--sh-in-sm);
    border-radius:12px; padding:11px 12px; color:var(--ink); font-family:'Inter',sans-serif; font-size:13.5px; resize:vertical; }
  .field input::placeholder, .field textarea::placeholder{ color:var(--muted-2); }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:8px 13px; border-radius:20px; font-size:12.5px; font-weight:500; background:var(--bg);
    border:none; color:var(--muted); cursor:pointer; box-shadow:var(--sh-out-sm); }
  .chip.active{ background:var(--grad); color:#fff; font-weight:600; box-shadow:var(--sh-out-sm); }
  .chip:active{ box-shadow:var(--sh-in-sm); }
  .card{ background:var(--bg); border:none; border-radius:17px; padding:16px; box-shadow:var(--sh-out); }
  .checkbox-row{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink); cursor:pointer; }
  .checkbox-box{ width:19px; height:19px; border-radius:6px; background:var(--bg); box-shadow:var(--sh-in-sm);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--coral); }

  /* output */
  .cta-btn{ width:100%; background:var(--grad); color:#fff; border:none; border-radius:14px; padding:14px;
    font-weight:700; font-size:14px; cursor:pointer; font-family:'Sora',sans-serif; display:flex; align-items:center;
    justify-content:center; gap:8px; box-shadow:var(--sh-out); }
  .cta-btn:active{ box-shadow:var(--sh-in); }
  .cta-btn:disabled{ opacity:0.5; cursor:default; }
  .cta-btn.ghost{ background:var(--bg); color:var(--ink); box-shadow:var(--sh-out-sm); }
  .cta-btn.ghost:active{ box-shadow:var(--sh-in-sm); }
  .output-box{ margin-top:14px; background:var(--bg); border:none; border-radius:15px;
    padding:15px; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.65; color:var(--ink);
    white-space:pre-wrap; box-shadow:var(--sh-in); }
  .output-box.accent{ box-shadow:var(--sh-in), inset 0 0 0 1.5px var(--violet); }
  .output-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .output-label{ font-family:'Sora',sans-serif; font-weight:700; font-size:12.5px; display:flex; align-items:center; gap:7px; }
  .copy-btn{ display:flex; align-items:center; gap:6px; background:var(--bg); border:none; box-shadow:var(--sh-out-sm);
    color:var(--ink); border-radius:10px; padding:6px 11px; font-size:11.5px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif; }
  .copy-btn.done{ color:var(--ok); box-shadow:var(--sh-out-sm), inset 0 0 0 1.5px var(--ok); }
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; padding:3px 9px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.4px; }
  .badge.ai{ background:var(--grad); color:#fff; }
  .badge.veo{ background:#1A73E8; color:#fff; }

  /* AI refine / generation */
  .ai-key-row{ display:flex; gap:8px; margin-top:10px; }
  .ai-key-row input{ flex:1; background:var(--bg); border:none; box-shadow:var(--sh-in-sm); border-radius:12px;
    padding:11px 12px; color:var(--ink); font-family:'Inter',sans-serif; font-size:13px; }
  .ai-note{ font-size:11px; color:var(--muted-2); margin-top:8px; line-height:1.5; }
  .ai-status{ font-size:12px; margin-top:10px; display:flex; align-items:center; gap:8px; }
  .ai-status.err{ color:var(--err); }
  .ai-status.ok{ color:var(--ok); }
  .spin{ animation:spin 0.9s linear infinite; width:14px; height:14px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  video, .result-image{ width:100%; border-radius:14px; margin-top:12px; display:block; box-shadow:var(--sh-out); }

  /* history */
  .hist-item{ background:var(--bg); border:none; border-radius:14px; padding:12px 13px;
    margin-bottom:9px; cursor:pointer; box-shadow:var(--sh-out-sm); }
  .hist-item:active{ box-shadow:var(--sh-in-sm); }
  .hist-top{ display:flex; align-items:center; justify-content:space-between; }
  .hist-tpl{ font-weight:600; font-size:12.5px; }
  .hist-time{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted-2); }
  .hist-preview{ font-size:11px; color:var(--muted); margin-top:5px; line-height:1.4; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .hist-del{ background:none; border:none; color:var(--muted-2); cursor:pointer; padding:2px; }
  .empty-hint{ font-size:12px; color:var(--muted-2); text-align:center; padding:16px 0; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <div>
        <div class="brand-name">PROMPO</div>
        <div class="brand-tag">Prompt AI untuk Kandungan Kreatif</div>
      </div>
    </div>
    <div class="cat-tabs" id="cat-tabs"></div>
  </header>
  <main id="root"></main>
</div>

<script>
  const CATEGORIES = [
    { key:'video', emoji:'🎬', label:'Video Media Sosial' },
    { key:'affiliate', emoji:'💰', label:'Affiliate' },
    { key:'poster', emoji:'🖼️', label:'Poster' },
    { key:'komik', emoji:'📚', label:'Komik' },
  ];
  let activeCategory = 'video';

  const ICONS = {
    copy: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>',
    wand: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M17.8 6.2L19 5M12.2 6.2L11 5M12.2 11.8L13 13"/><path d="M3 21l9-9"/><path d="M12.2 6.2a3 3 0 1 0 4 4"/></svg>',
    film: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 8h5M2 16h5M17 8h5M17 16h5"/></svg>',
    image: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14"/></svg>',
    spin: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="34 20"/></svg>',
  };

  // ================= shared option lists =================
  const ASPECTS = ['9:16','1:1','16:9'];
  const DURATIONS = ['5 saat','10 saat','15 saat','30 saat','60 saat'];
  const STYLES = ['Sinematik','Minimalis','Vibrant/Warna-warni','Retro/Vintage','UGC Autentik','Mewah/Luxury','Animasi 3D'];
  const MOODS = ['Bertenaga','Santai','Emosional','Kelakar','Aspirasi','Misteri'];
  const CAMERAS = ['Tetap (Static)','Pan Lambat','Zoom In Dramatik','Handheld/UGC','Drone/Aerial','Tracking Shot','Overhead/Top-down','Split-screen'];
  const LIGHTS = ['Semula Jadi','Golden Hour','Studio Terang','Neon/Malam','Dramatik/Kontras Tinggi'];
  const VIDEO_PLATFORMS = ['TikTok','Instagram Reels','YouTube Shorts','Facebook Reels'];
  const AFFILIATE_PLATFORMS = ['TikTok Shop','Shopee Live','Lazada','Instagram','YouTube'];
  const POSTER_RATIOS = ['1:1','4:5','9:16','16:9'];
  const POSTER_STYLES = ['Moden Minimalis','Mewah/Emas','Retro/Vintage','Playful/Warna-warni','Korporat/Profesional','Grunge/Bold'];
  const KOMIK_STYLES = ['Manga Hitam Putih','Webtoon Berwarna','Komik Barat Klasik','Superhero Retro','Chibi/Kartun Comel'];
  const KOMIK_TONES = ['Kelakar','Serius','Aksi','Emosional','Misteri'];
  const KOMIK_PANELS = ['2','3','4','6'];

  const EN = {
    platform: { 'TikTok':'TikTok', 'Instagram Reels':'Instagram Reels', 'YouTube Shorts':'YouTube Shorts', 'Facebook Reels':'Facebook Reels', 'TikTok Shop':'TikTok Shop', 'Shopee Live':'Shopee Live', 'Lazada':'Lazada', 'Instagram':'Instagram', 'YouTube':'YouTube' },
    aspect: { '9:16':'vertical 9:16', '1:1':'square 1:1', '16:9':'horizontal 16:9' },
    duration: { '5 saat':'5-second', '10 saat':'10-second', '15 saat':'15-second', '30 saat':'30-second', '60 saat':'60-second' },
    style: { 'Sinematik':'cinematic', 'Minimalis':'minimalist', 'Vibrant/Warna-warni':'vibrant and colorful', 'Retro/Vintage':'retro vintage', 'UGC Autentik':'authentic UGC (user-generated content) style', 'Mewah/Luxury':'luxurious and premium', 'Animasi 3D':'3D animated' },
    mood: { 'Bertenaga':'energetic', 'Santai':'relaxed and casual', 'Emosional':'emotional and heartfelt', 'Kelakar':'funny and lighthearted', 'Aspirasi':'aspirational', 'Misteri':'mysterious and intriguing' },
    camera: { 'Tetap (Static)':'a static, locked-off shot', 'Pan Lambat':'a slow panning shot', 'Zoom In Dramatik':'a dramatic zoom-in', 'Handheld/UGC':'handheld, UGC-style movement', 'Drone/Aerial':'an aerial drone shot', 'Tracking Shot':'a smooth tracking shot', 'Overhead/Top-down':'a top-down overhead shot', 'Split-screen':'a split-screen transition' },
    light: { 'Semula Jadi':'natural lighting', 'Golden Hour':'warm golden hour lighting', 'Studio Terang':'bright studio lighting', 'Neon/Malam':'neon night lighting', 'Dramatik/Kontras Tinggi':'dramatic high-contrast lighting' },
    posterStyle: { 'Moden Minimalis':'modern minimalist', 'Mewah/Emas':'luxurious gold-accented', 'Retro/Vintage':'retro vintage', 'Playful/Warna-warni':'playful and colorful', 'Korporat/Profesional':'corporate professional', 'Grunge/Bold':'bold grunge' },
  };

  // ================= templates per category =================
  const TEMPLATES = {
    video: [
      { key:'produk', emoji:'📦', name:'Tunjuk Produk', desc:'Fokus ciri & rupa produk', fields:{ style:'Sinematik', mood:'Aspirasi', camera:'Tracking Shot', light:'Studio Terang' }, subjectHint:'Nama produk & ciri utamanya' },
      { key:'unboxing', emoji:'🎁', name:'Unboxing', desc:'Buka kotak, tunjuk reaksi', fields:{ style:'UGC Autentik', mood:'Santai', camera:'Handheld/UGC', light:'Semula Jadi' }, subjectHint:'Produk & kotak pembungkusan' },
      { key:'sebelum', emoji:'🔄', name:'Sebelum & Selepas', desc:'Transformasi/hasil', fields:{ style:'Minimalis', mood:'Bertenaga', camera:'Split-screen', light:'Semula Jadi' }, subjectHint:'Apa yang berubah/bertambah baik' },
      { key:'testimoni', emoji:'🗣️', name:'Testimoni', desc:'Pelanggan bercakap ke kamera', fields:{ style:'UGC Autentik', mood:'Emosional', camera:'Tetap (Static)', light:'Semula Jadi' }, subjectHint:'Pengalaman pelanggan sebenar' },
      { key:'pov', emoji:'👀', name:'Trend/POV', desc:'Sudut pandang orang pertama', fields:{ style:'Vibrant/Warna-warni', mood:'Kelakar', camera:'Handheld/UGC', light:'Neon/Malam' }, subjectHint:'Situasi/momen relatable' },
      { key:'tutorial', emoji:'📝', name:'Tutorial Pantas', desc:'Langkah demi langkah', fields:{ style:'Minimalis', mood:'Bertenaga', camera:'Overhead/Top-down', light:'Studio Terang' }, subjectHint:'Proses/cara buat sesuatu' },
      { key:'jenama', emoji:'✨', name:'Cerita Jenama', desc:'Kisah di sebalik jenama', fields:{ style:'Sinematik', mood:'Aspirasi', camera:'Drone/Aerial', light:'Golden Hour' }, subjectHint:'Misi/nilai jenama anda' },
      { key:'hook', emoji:'⚡', name:'Hook Viral', desc:'3 saat pembuka yang tarik perhatian', fields:{ style:'Vibrant/Warna-warni', mood:'Misteri', camera:'Zoom In Dramatik', light:'Dramatik/Kontras Tinggi' }, subjectHint:'Kejutan/soalan pembuka' },
    ],
    affiliate: [
      { key:'banding', emoji:'⚖️', name:'Perbandingan Produk', desc:'A vs B, mana lebih baik', fields:{ style:'Minimalis', mood:'Bertenaga', camera:'Split-screen', light:'Studio Terang' }, subjectHint:'2 produk yang dibandingkan' },
      { key:'top5', emoji:'🏆', name:'Senarai Top 5', desc:'Senarai produk pilihan', fields:{ style:'Vibrant/Warna-warni', mood:'Bertenaga', camera:'Zoom In Dramatik', light:'Studio Terang' }, subjectHint:'Kategori produk (cth: skincare)' },
      { key:'unbox-promo', emoji:'🎁', name:'Unboxing + Kod Promo', desc:'Buka kotak, tunjuk diskaun', fields:{ style:'UGC Autentik', mood:'Santai', camera:'Handheld/UGC', light:'Semula Jadi' }, subjectHint:'Produk yang dipromosikan' },
      { key:'flash', emoji:'⏰', name:'Flash Sale Countdown', desc:'Tekanan masa, segera beli', fields:{ style:'Vibrant/Warna-warni', mood:'Misteri', camera:'Zoom In Dramatik', light:'Neon/Malam' }, subjectHint:'Produk dalam jualan kilat' },
      { key:'testimoni-beli', emoji:'💬', name:'Testimoni + CTA Beli', desc:'Kongsi pengalaman, ajak beli', fields:{ style:'UGC Autentik', mood:'Emosional', camera:'Tetap (Static)', light:'Semula Jadi' }, subjectHint:'Produk yang digunakan' },
      { key:'tips-produk', emoji:'💡', name:'Tips & Produk Berkaitan', desc:'Kongsi tip, selit produk', fields:{ style:'Minimalis', mood:'Santai', camera:'Overhead/Top-down', light:'Studio Terang' }, subjectHint:'Tip berkaitan niche anda' },
    ],
    poster: [
      { key:'jualan', emoji:'🏷️', name:'Jualan/Promosi', desc:'Diskaun, tawaran istimewa', fields:{ style:'Playful/Warna-warni' } },
      { key:'lancar', emoji:'🚀', name:'Pelancaran Produk', desc:'Produk/perkhidmatan baharu', fields:{ style:'Moden Minimalis' } },
      { key:'event', emoji:'📅', name:'Event/Webinar', desc:'Jemputan program/seminar', fields:{ style:'Korporat/Profesional' } },
      { key:'umum', emoji:'📢', name:'Pengumuman', desc:'Notis/maklumat penting', fields:{ style:'Moden Minimalis' } },
      { key:'quote', emoji:'💫', name:'Kutipan/Motivasi', desc:'Poster kata-kata semangat', fields:{ style:'Mewah/Emas' } },
      { key:'ba', emoji:'🔁', name:'Sebelum & Selepas', desc:'Tunjuk hasil transformasi', fields:{ style:'Grunge/Bold' } },
    ],
    komik: [
      { key:'strip4', emoji:'😂', name:'Strip 4-Panel Kelakar', desc:'Jenaka pendek harian', fields:{ artStyle:'Webtoon Berwarna', tone:'Kelakar', panels:'4' } },
      { key:'aksi', emoji:'💥', name:'Cerita Aksi Pendek', desc:'Aksi/pengembaraan ringkas', fields:{ artStyle:'Komik Barat Klasik', tone:'Aksi', panels:'4' } },
      { key:'iklan-komik', emoji:'🛍️', name:'Iklan Gaya Komik', desc:'Promosi produk dalam komik', fields:{ artStyle:'Chibi/Kartun Comel', tone:'Kelakar', panels:'3' } },
      { key:'meme', emoji:'🔁', name:'Meme Bersiri', desc:'Format meme 2-panel', fields:{ artStyle:'Manga Hitam Putih', tone:'Kelakar', panels:'2' } },
      { key:'panduan', emoji:'📋', name:'Panduan Langkah', desc:'How-to dalam bentuk komik', fields:{ artStyle:'Webtoon Berwarna', tone:'Serius', panels:'4' } },
    ],
  };

  // ================= per-category form state =================
  let form = {
    video: { platform:'TikTok', aspect:'9:16', duration:'15 saat', style:'Sinematik', mood:'Bertenaga', camera:'Tetap (Static)', light:'Semula Jadi', subject:'', extra:'', onscreen:'', cta:'', template:null },
    affiliate: { platform:'TikTok Shop', aspect:'9:16', duration:'15 saat', style:'UGC Autentik', mood:'Bertenaga', camera:'Handheld/UGC', light:'Semula Jadi', subject:'', promo:'', price:'', disclosure:true, onscreen:'', extra:'', cta:'', template:null },
    poster: { ratio:'1:1', style:'Moden Minimalis', headline:'', subtext:'', brandColor:'', extra:'', cta:'', template:null },
    komik: { artStyle:'Webtoon Berwarna', tone:'Kelakar', panels:'4', character:'', story:'', dialogue:'', template:null },
  };

  let lastPrompt = '';
  let lastRefined = '';
  let refining = false;
  let refineError = '';

  function applyTemplate(key) {
    const list = TEMPLATES[activeCategory];
    const t = list.find(x => x.key === key);
    if (!t) return;
    const f = form[activeCategory];
    f.template = key;
    Object.assign(f, t.fields);
    render();
  }
  function setField(key, val) { form[activeCategory][key] = val; render(); }
  function toggleField(key) { form[activeCategory][key] = !form[activeCategory][key]; render(); }

  // ================= prompt builders =================
  // Appended to every generated prompt — a well-known technique (explicit negative/exclusion
  // constraints) that measurably reduces drift and unwanted additions in video/image models.
  const CONSTRAINTS_VIDEO = '\n\nImportant constraints: do not add any on-screen text other than what is explicitly specified above. Keep the subject\'s appearance, colors, and style fully consistent throughout the clip. Do not introduce unrelated objects, extra people, or scene changes not described here.';

  // ================= internal prompt checker (deterministic, no API needed) =================
  // Catches common causes of inaccurate generations before spending an expensive Veo/image call.
  const RISK_WORDS = ['senjata','pistol','bunuh','membunuh','darah','bogel','seksual','ganas','peluru','bom','rogol'];
  const LIGHT_CLASH_WORDS = {
    'Golden Hour': ['malam','neon','gelap'],
    'Neon/Malam': ['siang','terang matahari','golden hour'],
    'Semula Jadi': [],
  };
  function checkPrompt(promptText) {
    const issues = [];
    const wordCount = promptText.trim().split(/\s+/).filter(Boolean).length;
    if (wordCount < 20) issues.push({ level:'warn', msg:'Prompt agak ringkas (' + wordCount + ' patah perkataan) — tambah butiran supaya AI tidak meneka sendiri.' });
    if (wordCount > 200) issues.push({ level:'warn', msg:'Prompt agak panjang (' + wordCount + ' patah perkataan) — model mungkin abaikan sebahagian arahan.' });

    const f = form[activeCategory];
    if ((activeCategory === 'video' || activeCategory === 'affiliate') && (!f.subject || f.subject.trim().split(/\s+/).filter(Boolean).length < 2)) {
      issues.push({ level:'error', msg:'Subjek/produk terlalu umum atau kosong — nyatakan rupa, warna, atau ciri khusus.' });
    }
    if (activeCategory === 'poster' && (!f.headline || f.headline.trim().length < 3)) {
      issues.push({ level:'error', msg:'Headline poster kosong atau terlalu pendek.' });
    }
    if (activeCategory === 'komik') {
      const lines = (f.dialogue || '').split('\n').map(s => s.trim()).filter(Boolean);
      const panelNum = parseInt(f.panels, 10);
      if (lines.length && lines.length !== panelNum) {
        issues.push({ level:'warn', msg:'Bilangan baris dialog (' + lines.length + ') tak sepadan bilangan panel (' + panelNum + ') — AI mungkin salah agih adegan.' });
      }
    }
    if (activeCategory === 'video' || activeCategory === 'affiliate') {
      const clashWords = LIGHT_CLASH_WORDS[f.light] || [];
      const extraLower = (f.extra || '').toLowerCase();
      const clash = clashWords.filter(w => extraLower.includes(w));
      if (clash.length) issues.push({ level:'warn', msg:'Pencahayaan "' + f.light + '" mungkin bercanggah dengan "' + clash.join(', ') + '" dalam elemen tambahan.' });
      if (veoTarget > 0 && !veoSupportsExtend()) {
        issues.push({ level:'warn', msg:'Model Veo dipilih tidak sokong sambungan video — hasil akan terhenti pada 8 saat sahaja.' });
      }
    }
    const lower = promptText.toLowerCase();
    const foundRisk = RISK_WORDS.filter(w => lower.includes(w));
    if (foundRisk.length) issues.push({ level:'error', msg:'Prompt mengandungi perkataan berisiko disekat penapis keselamatan Google: ' + foundRisk.join(', ') + '.' });

    const errorCount = issues.filter(i => i.level === 'error').length;
    const warnCount = issues.filter(i => i.level === 'warn').length;
    const score = Math.max(0, 100 - errorCount * 30 - warnCount * 12);
    return { issues, score };
  }

  // A specific continuity anchor (restating actual subject/style/lighting) works far better than
  // a generic "continue the scene" line — it gives Veo concrete anchors to preserve, reducing
  // drift in the subject's appearance across each extend stage.
  function continuityAnchor() {
    const f = form[activeCategory];
    const subject = (f.subject || f.headline || f.character || 'the main subject').trim();
    const styleEN = EN.style[f.style] || EN.posterStyle[f.style] || f.style || '';

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  async function runVeoJob(key, body, stageLabel) {
    const startRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + veoModel + ':predictLongRunning', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body),
    });
    const startData = await startRes.json();
    if (!startRes.ok) throw new Error((startData.error && startData.error.message) || ('HTTP ' + startRes.status));
    const opName = startData.name;
    if (!opName) throw new Error('Tiada operation ID diterima daripada Veo.');
    const pollUrl = 'https://generativelanguage.googleapis.com/v1beta/' + opName;
    let done = false, pollData = null;
    while (!done) {
      await new Promise(r => setTimeout(r, 8000));
      const pollRes = await fetch(pollUrl, { headers: { 'x-goog-api-key': key } });
      pollData = await pollRes.json();
      if (!pollRes.ok) throw new Error((pollData.error && pollData.error.message) || ('HTTP ' + pollRes.status));
      done = !!pollData.done;
      if (!done) { veoStatus = stageLabel + ' (' + Math.round((Date.now() - veoStartTime) / 1000) + ' saat berlalu)'; render(); }
    }
    const samples = pollData.response && pollData.response.generateVideoResponse && pollData.response.generateVideoResponse.generatedSamples;
    if (!samples || !samples.length) {
      const filtered = pollData.response && pollData.response.raiMediaFilteredCount;
      throw new Error(filtered ? 'Video disekat oleh penapis keselamatan Google. Cuba ubah prompt anda.' : 'Tiada video dihasilkan.');
    }
    veoStatus = 'Memuat turun video...';
    render();
    const videoRes = await fetch(samples[0].video.uri, { headers: { 'x-goog-api-key': key } });
    if (!videoRes.ok) throw new Error('Gagal muat turun video (HTTP ' + videoRes.status + ')');
    const blob = await videoRes.blob();
    const base64 = await blobToBase64(blob);
    return { blob, base64 };
  }

  function renderPromptCheck() {
    if (!promptCheck) return '';
    const s = promptCheck.score;
    const color = s >= 80 ? 'var(--ok)' : s >= 50 ? 'var(--warn)' : 'var(--err)';
    const label = s >= 80 ? 'Baik' : s >= 50 ? 'Boleh Diperbaiki' : 'Berisiko';
    let html = '<div class="card" style="margin-top:14px;">';
    html += '<div class="output-head" style="margin-bottom:' + (promptCheck.issues.length ? '10px' : '0') + ';">';
    html += '<div class="output-label">' + ICONS.check + ' Semakan Prompt</div>';
    html += '<div class="badge" style="background:' + color + ';color:#fff;">' + s + '/100 · ' + label + '</div>';
    html += '</div>';
    if (promptCheck.issues.length === 0) {
      html += '<div class="ai-note" style="color:var(--ok);">Tiada isu dikesan — prompt lengkap dan spesifik.</div>';
    } else {
      html += promptCheck.issues.map(i =>
        '<div class="ai-status ' + (i.level === 'error' ? 'err' : '') + '" style="align-items:flex-start;margin-top:6px;color:' + (i.level==='error' ? 'var(--err)' : 'var(--warn)') + ';">' +
        '<span style="flex-shrink:0;">' + (i.level === 'error' ? '⛔' : '⚠️') + '</span> ' + i.msg + '</div>'
      ).join('');
    }
    html += '<div class="ai-note" style="margin-top:9px;">Semakan ini dijalankan terus di peranti (tiada API) berdasarkan peraturan yang direka untuk kurangkan risiko video/imej tak tepat atau disekat penapis keselamatan.</div>';
    html += '</div>';
    return html;
  }

  function renderOutputSection() {
    let html = '<section id="output-section">';
    html += '<button class="cta-btn" onclick="generatePrompt()">' + ICONS.sparkle + ' Jana Prompt</button>';

    if (lastPrompt) {
      html += '<div class="output-box"><div class="output-head"><div class="output-label">Prompt Draf</div>' +
        '<button class="copy-btn" id="copy-draft" onclick="copyText(' + jsAttr(lastPrompt) + ',\'copy-draft\')">' + ICONS.copy + ' Salin</button></div>' +
        escapeHtml(lastPrompt) + '</div>';

      html += renderPromptCheck();

      html += '<div class="card" style="margin-top:14px;">';
      html += '<div class="output-label" style="margin-bottom:4px;">' + ICONS.wand + ' Perhalusi dengan Claude AI <span class="badge ai">AI</span></div>';
      html += '<div class="ai-key-row"><input type="password" id="api-key-input" placeholder="Kunci API Anthropic (sk-ant-...)" value="' + escapeHtml(loadApiKey()) + '">';
      html += '<button class="cta-btn ghost" style="width:auto;padding:0 16px;" onclick="refineWithAI()"' + (refining ? ' disabled' : '') + '>' + (refining ? ICONS.spin : 'Perhalusi') + '</button></div>';
      html += '<div class="ai-note">Kunci API disimpan pada peranti ini sahaja dan dihantar terus ke api.anthropic.com dari pelayar anda. Dapatkan kunci di <a href="https://console.anthropic.com" target="_blank" rel="noopener" style="color:var(--violet);">console.anthropic.com</a>.</div>';
      if (refineError) html += '<div class="ai-status err">' + refineError + '</div>';
      html += '</div>';

      if (lastRefined) {
        html += '<div class="output-box accent" style="margin-top:14px;">';
        html += '<div class="output-head"><div class="output-label">' + ICONS.wand + ' Prompt Diperhalusi</div>' +
          '<button class="copy-btn" id="copy-refined" onclick="copyText(' + jsAttr(lastRefined) + ',\'copy-refined\')">' + ICONS.copy + ' Salin</button></div>';
        html += escapeHtml(lastRefined) + '</div>';
      }

      const isVideoType = (activeCategory === 'video' || activeCategory === 'affiliate');
      const isImageType = (activeCategory === 'poster' || activeCategory === 'komik');

      if (isVideoType) {
        html += '<div class="card" style="margin-top:14px;">';
        html += '<div class="output-label" style="margin-bottom:4px;">' + ICONS.film + ' Jana Video Sebenar dengan Veo <span class="badge veo">GOOGLE</span></div>';
        html += '<div class="ai-note">Guna prompt di atas (versi diperhalusi jika ada) untuk terus jana fail MP4. Akaun Google berbayar berasingan — anggaran 30 saat hingga beberapa minit setiap video.</div>';
        html += '<div class="field" style="margin-top:11px;margin-bottom:9px;"><label>Model</label><div class="chip-row">';
        VEO_MODELS.forEach(m => { html += '<button type="button" class="chip' + (veoModel === m.key ? ' active' : '') + '" onclick="setVeoModel(\'' + m.key + '\')">' + m.label + '</button>'; });
        html += '</div></div>';
        html += '<div class="field" style="margin-bottom:9px;"><label>Resolusi</label><div class="chip-row">';
        ['720p','1080p'].forEach(r => { html += '<button type="button" class="chip' + (veoResolution === r ? ' active' : '') + '" onclick="setVeoResolution(\'' + r + '\')">' + r + '</button>'; });
        html += '</div></div>';
        html += '<div class="field" style="margin-bottom:0;"><label>Sasaran Durasi Video</label><div class="chip-row">';
        VEO_TARGETS.forEach(t => { html += '<button type="button" class="chip' + (veoTarget === t.key ? ' active' : '') + '" onclick="setVeoTarget(' + t.key + ')">' + t.label + '</button>'; });
        html += '</div></div>';
        if (veoTarget > 0 && !veoSupportsExtend()) {
          html += '<div class="ai-status err" style="margin-top:8px;">Sambung video (extend) cuma disokong oleh Veo 3.1 / Veo 3.1 Fast. Akan dijana 8 saat sahaja dengan model ini.</div>';
        } else if (veoTarget > 0) {
          html += '<div class="ai-note" style="margin-top:8px;">App akan buat ' + (veoTarget + 1) + ' panggilan API berturutan untuk capai ~' + VEO_TARGETS.find(t=>t.key===veoTarget).label + ' — masa &amp; kos ' + (veoTarget + 1) + 'x ganda, dan sambungan dipaksa 720p oleh Veo.</div>';
        }
        html += '<div class="ai-note" style="margin-top:9px;">Klip asal: ' + nearestVeoDuration() + ' saat, nisbah ' + veoAspectRatio() + ' (had teknikal Veo).</div>';
        html += '<div class="ai-key-row" style="margin-top:9px;"><input type="password" id="google-key-input" placeholder="Kunci API Google AI (AIza...)" value="' + escapeHtml(loadGoogleKey()) + '">';
        html += '<button class="cta-btn ghost" style="width:auto;padding:0 16px;" onclick="generateVeoVideo()"' + (veoBusy ? ' disabled' : '') + '>' + (veoBusy ? ICONS.spin : 'Jana Video') + '</button></div>';
        html += '<div class="ai-note">Kunci disimpan pada peranti ini sahaja. Dapatkan kunci di <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--violet);">aistudio.google.com/apikey</a>.</div>';
        if (veoStatus) html += '<div class="ai-status">' + ICONS.spin + ' ' + veoStatus + '</div>';
        if (veoError) html += '<div class="ai-status err">' + veoError + '</div>';
        if (veoVideoUrl) {
          html += '<video controls playsinline src="' + veoVideoUrl + '"></video>';
          html += '<a href="' + veoVideoUrl + '" download="prompo-video.mp4" class="cta-btn ghost" style="margin-top:10px;">Muat Turun MP4</a>';
          html += '<div class="ai-note" style="margin-top:8px;">Video disimpan di pelayan Google selama 2 hari sahaja — muat turun sekarang.</div>';
        }
        html += '</div>';
      }

      if (isImageType) {
        html += '<div class="card" style="margin-top:14px;">';
        html += '<div class="output-label" style="margin-bottom:4px;">' + ICONS.image + ' Jana Imej Sebenar (Nano Banana) <span class="badge veo">GOOGLE</span></div>';
        html += '<div class="ai-note">Guna prompt di atas untuk terus jana fail imej PNG, dengan Google Gemini image generation.</div>';
        html += '<div class="ai-key-row" style="margin-top:9px;"><input type="password" id="google-key-input" placeholder="Kunci API Google AI (AIza...)" value="' + escapeHtml(loadGoogleKey()) + '">';
        html += '<button class="cta-btn ghost" style="width:auto;padding:0 16px;" onclick="generateImage()"' + (imgBusy ? ' disabled' : '') + '>' + (imgBusy ? ICONS.spin : 'Jana Imej') + '</button></div>';
        html += '<div class="ai-note">Kunci disimpan pada peranti ini sahaja. Dapatkan kunci di <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--violet);">aistudio.google.com/apikey</a>.</div>';
        if (imgError) html += '<div class="ai-status err">' + imgError + '</div>';
        if (imgResultUrl) {
          html += '<img class="result-image" src="' + imgResultUrl + '" alt="Hasil jana imej">';
          html += '<a href="' + imgResultUrl + '" download="prompo-image.png" class="cta-btn ghost" style="margin-top:10px;">Muat Turun PNG</a>';
        }
        html += '</div>';
      }
    }
    html += '</section>';
    return html;
  }

  function renderHistorySection() {
    const hist = loadHistory();
    let html = '<section><div class="sec-title"><span class="num">5</span> Riwayat Prompt</div>';
    if (hist.length === 0) {
      html += '<div class="empty-hint">Prompt yang dijana akan disimpan di sini.</div>';
    } else {
      hist.forEach(h => {
        html += '<div class="hist-item" onclick="reuseHistory(' + h.id + ')"><div class="hist-top"><div class="hist-tpl">' + (h.categoryLabel || '') + ' · ' + escapeHtml(h.template) + (h.subject ? ' — ' + escapeHtml(h.subject) : '') + '</div>' +
          '<button class="hist-del" onclick="deleteHistory(' + h.id + ', event)">' + ICONS.trash + '</button></div>' +
          '<div class="hist-time">' + new Date(h.time).toLocaleString('ms-MY') + '</div>' +
          '<div class="hist-preview">' + escapeHtml(h.prompt) + '</div></div>';
      });
    }
    html += '</section>';
    return html;
  }

  function render() {
    renderTabs();
    const root = document.getElementById('root');
    let html = renderTemplateSection();
    if (activeCategory === 'video') html += renderVideoForm();
    else if (activeCategory === 'affiliate') html += renderAffiliateForm();
    else if (activeCategory === 'poster') html += renderPosterForm();
    else if (activeCategory === 'komik') html += renderKomikForm();
    html += renderOutputSection();
    html += renderHistorySection();
    root.innerHTML = html;
  }

  render();
</script>
